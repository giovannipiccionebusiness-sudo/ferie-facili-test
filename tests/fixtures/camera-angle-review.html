<!doctype html><html lang="it"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../live-camera.css"><h1>Prova fotocamera · foglio sintetico</h1><button id="open">Apri prova</button><p id="result"></p><script type="module">
import {openDocumentCamera} from '../../live-camera.js';
let tilted=true;const frame=document.createElement('canvas');frame.width=640;frame.height=480;const ctx=frame.getContext('2d');function draw(){ctx.fillStyle='#252525';ctx.fillRect(0,0,640,480);ctx.fillStyle='#f8f8f8';ctx.beginPath();const p=tilted?[[200,40],[440,40],[560,440],[80,440]]:[[180,40],[460,40],[460,440],[180,440]];p.forEach(([x,y],i)=>ctx[i?'lineTo':'moveTo'](x,y));ctx.closePath();ctx.fill();ctx.fillStyle='#333';ctx.font='18px sans-serif';ctx.fillText('DOCUMENTO FITTIZIO',210,170);}draw();setInterval(draw,100);
Object.defineProperty(navigator,'mediaDevices',{value:{getUserMedia:async()=>frame.captureStream(12)}});
document.getElementById('open').onclick=async()=>{const done=openDocumentCamera(),dialog=document.querySelector('dialog'),actions=dialog.querySelector(':scope>div:last-child');for(const [text,value] of [['Simula foglio dritto',false],['Simula foglio inclinato',true]]){const b=document.createElement('button');b.textContent=text;b.onclick=()=>{tilted=value;draw();};actions.append(b);}const file=await done;document.getElementById('result').textContent=file instanceof File?file.type:'Chiuso';};
</script></html>
